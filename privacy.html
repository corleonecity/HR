            html += `<p><strong>${t.lastUpdated}</strong></p>`;
            
            html += `<h2>${t.section1_title}</h2><p>${t.section1_text}</p>`;
            
            html += `<h2>${t.section2_title}</h2><p>${t.section2_text}</p><ul>`;
            t.section2_items.forEach(item => { html += `<li>${item}</li>`; });
            html += `</ul>`;
            
            html += `<h2>${t.section3_title}</h2><ul>`;
            t.section3_items.forEach(item => { html += `<li>${item}</li>`; });
            html += `</ul>`;
            
            html += `<h2>${t.section4_title}</h2><p>${t.section4_text}</p>`;
            html += `<h2>${t.section5_title}</h2><p>${t.section5_text}</p>`;
            html += `<h2>${t.section6_title}</h2><p>${t.section6_text}</p>`;
            html += `<h2>${t.section7_title}</h2><p>${t.section7_text}</p>`;
            
            contentDiv.innerHTML = html;
        }

        select.value = savedLang;
        renderPage(savedLang);

            const newLang = e.target.value;
            localStorage.setItem('privacy_language', newLang);
