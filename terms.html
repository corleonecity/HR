            html += `<h2>${t.section2_title}</h2><p>${t.section2_text}</p>`;
            
            html += `<h2>${t.section3_title}</h2><ul>`;
            t.section3_items.forEach(item => { html += `<li>${item}</li>`; });
            html += `</ul>`;
            
            html += `<h2>${t.section4_title}</h2><p>${t.section4_text}</p><ul>`;
            t.section4_items.forEach(item => { html += `<li>${item}</li>`; });
            html += `</ul>`;
            
            html += `<h2>${t.section5_title}</h2><p>${t.section5_text}</p>`;
            html += `<h2>${t.section6_title}</h2><p>${t.section6_text}</p>`;
            html += `<h2>${t.section7_title}</h2><p>${t.section7_text}</p>`;
            html += `<h2>${t.section8_title}</h2><p>${t.section8_text}</p>`;
            
            contentDiv.innerHTML = html;
        }
